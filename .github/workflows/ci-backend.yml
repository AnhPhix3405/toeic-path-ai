name: CI — Backend

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-backend:
    name: Backend Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- apps/backend .github/workflows/ci-backend.yml)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Backend changes detected:"
            echo "$CHANGED_FILES"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend changes in this PR — skipping heavy CI steps."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.changes.outputs.should_run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        if: steps.changes.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/backend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.changes.outputs.should_run == 'true'
        working-directory: apps/backend
        run: pnpm install --frozen-lockfile

      - name: Lint (check-only)
        if: steps.changes.outputs.should_run == 'true'
        working-directory: apps/backend
        run: pnpm exec eslint "src/**/*.ts" "test/**/*.ts" --no-error-on-unmatched-pattern

      - name: Unit tests
        if: steps.changes.outputs.should_run == 'true'
        working-directory: apps/backend
        run: pnpm run test

      - name: Build production bundle
        if: steps.changes.outputs.should_run == 'true'
        working-directory: apps/backend
        run: pnpm run build

  deploy:
    name: Deploy Backend (Render)
    needs: verify-backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render Deploy Hook
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          HOOK_MAIN: ${{ secrets.RENDER_DEPLOY_HOOK_MAIN }}
          HOOK_DEV: ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then
            DEPLOY_HOOK_URL="$HOOK_MAIN"
            SECRET_NAME="RENDER_DEPLOY_HOOK_MAIN"
          else
            DEPLOY_HOOK_URL="$HOOK_DEV"
            SECRET_NAME="RENDER_DEPLOY_HOOK_DEV"
          fi

          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing required GitHub secret: $SECRET_NAME"
            exit 1
          fi

          echo "Triggering Render deploy for branch: $TARGET_BRANCH"
          curl -fsS --max-time 30 --retry 2 --retry-delay 5 -X POST "$DEPLOY_HOOK_URL"
          echo ""
          echo "Render deploy hook accepted."
